
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E@trading - Account Access</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#071525;
 color:white;
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:100vh;
 padding:20px;
}
.container{
 width:100%;
 max-width:420px;
 background:#10263d;
 padding:28px;
 border-radius:15px;
 box-shadow:0 5px 25px #0008;
}
h1{text-align:center;color:#20d6a0}
h2{text-align:center}
p{text-align:center;color:#bdcbd8}
input{
 width:100%;
 padding:14px;
 margin:9px 0;
 border:1px solid #456078;
 border-radius:7px;
 background:#071525;
 color:white;
}
button{
 width:100%;
 padding:14px;
 margin-top:12px;
 border:0;
 border-radius:7px;
 background:#20d6a0;
 color:#071525;
 font-weight:bold;
 font-size:16px;
 cursor:pointer;
}
a{color:#20d6a0;cursor:pointer}
.links{text-align:center;margin-top:18px}
.hidden{display:none}
#message{
 margin-top:15px;
 text-align:center;
 overflow-wrap:anywhere;
}
</style>
</head>

<body>
<div class="container">

<h1>E@trading</h1>
<p>Your trading platform</p>

<div id="login">
<h2>Login</h2>
<input id="loginEmail" type="email" placeholder="Email address">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="loginUser()">Login</button>
<div class="links">
<a onclick="showSection('forgot')">Forgot Password?</a>
<br><br>
<a onclick="showSection('register')">Create Account</a>
</div>
</div>

<div id="register" class="hidden">
<h2>Create Account</h2>
<input id="fullname" placeholder="Full name">
<input id="phone" placeholder="Phone number">
<input id="regEmail" type="email" placeholder="Email address">
<input id="regPassword" type="password" placeholder="Create password">
<input id="confirm" type="password" placeholder="Confirm password">
<button onclick="registerUser()">Register</button>
<div class="links">
<a onclick="showSection('login')">Back to Login</a>
</div>
</div>

<div id="forgot" class="hidden">
<h2>Reset Password</h2>
<p>Enter your registered email address. We will send you a password reset link.</p>
<input id="resetEmail" type="email" placeholder="Registered email">
<button onclick="sendResetEmail()">Send Reset Link</button>
<div class="links">
<a onclick="showSection('login')">Back to Login</a>
</div>
</div>

<div id="newPassword" class="hidden">
<h2>Create New Password</h2>
<input id="newPass" type="password" placeholder="New password">
<input id="confirmNewPass" type="password" placeholder="Confirm new password">
<button onclick="updatePassword()">Save New Password</button>
</div>

<div id="message"></div>
</div>

<script>
const SUPABASE_URL =
"https://vfmswfhfphtusxcfzqhs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pt_o3PnyZtw6rMo8OYckXg_dnx_TnCW";

const supabaseClient =
window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const redirectURL = window.location.origin + window.location.pathname;

function showSection(section){
 ["login","register","forgot","newPassword"].forEach(id=>{
  document.getElementById(id).classList.add("hidden");
 });
 document.getElementById(section).classList.remove("hidden");
 document.getElementById("message").textContent="";
}

function message(text){
 document.getElementById("message").textContent=text;
}

async function registerUser(){
 const fullname=document.getElementById("fullname").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const email=document.getElementById("regEmail").value.trim();
 const password=document.getElementById("regPassword").value;
 const confirm=document.getElementById("confirm").value;

 if(!fullname || !phone || !email || !password){
  return message("Please complete all fields.");
 }
 if(password!==confirm){
  return message("Passwords do not match.");
 }
 if(password.length<6){
  return message("Password must have at least 6 characters.");
 }

 message("Creating account...");

 const {data,error}=await supabaseClient.auth.signUp({
  email,
  password,
  options:{
   emailRedirectTo:redirectURL,
   data:{full_name:fullname,phone:phone}
  }
 });

 if(error) return message(error.message);

 message("Account created. Check your email to confirm your account.");
}

async function loginUser(){
 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPassword").value;

 if(!email || !password){
  return message("Enter your email and password.");
 }

 message("Logging in...");

 const {data,error}=await supabaseClient.auth.signInWithPassword({
  email,password
 });

 if(error) return message(error.message);

 message("Login successful! Welcome to E@trading.");
}

async function sendResetEmail(){
 const email=document.getElementById("resetEmail").value.trim();

 if(!email){
  return message("Enter your registered email.");
 }

 message("Sending password reset email...");

 const {error}=await supabaseClient.auth.resetPasswordForEmail(
  email,
  {redirectTo:redirectURL}
 );

 if(error) return message(error.message);

 message("Password reset email sent. Check your inbox and spam folder.");
}

async function updatePassword(){
 const password=document.getElementById("newPass").value;
 const confirm=document.getElementById("confirmNewPass").value;

 if(password.length<6){
  return message("Password must have at least 6 characters.");
 }
 if(password!==confirm){
  return message("Passwords do not match.");
 }

 message("Updating password...");

 const {error}=await supabaseClient.auth.updateUser({
  password:password
 });

 if(error) return message(error.message);

 message("Password updated successfully. You can now log in.");
 showSection("login");
}

supabaseClient.auth.onAuthStateChange((event,session)=>{
 if(event==="PASSWORD_RECOVERY"){
  showSection("newPassword");
 }
});

if(window.location.hash.includes("type=recovery")){
 showSection("newPassword");
}
</script>
</body>
</html>
